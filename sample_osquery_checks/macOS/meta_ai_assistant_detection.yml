title: Meta AI Assistant Detection
id: 0fcb4a2e77bf48b6bed9fdf2ed38212b
description: |
    Detects the presence of Meta's "Meta AI" desktop chatbot application (ai.meta.com/meta-ai) on
    macOS devices, confirmed via a live installation's Info.plist (bundle identifier
    com.meta.endo.vanilla). Meta AI is a general-purpose Llama-based chatbot distinct from the
    Muse personal agent and the Muse Code CLI tool, though all three ship from the same
    com.meta.endo application family. Meta AI requests Screen Recording and Accessibility
    permissions to attach another window's visible text and a screenshot to a conversation,
    microphone access for voice dictation into any app, and read access to Calendars, Reminders,
    and Contacts to answer scheduling and lookup questions; it can also send Apple events to
    Messages and Notes to create content the user approves. All of this data, along with
    conversation history, is transmitted to Meta's servers, and Meta's own policy states chat
    content may be used to personalize ads in most regions. Because "Meta AI" and "Muse" share the
    com.meta.endo bundle identifier prefix, this detection anchors on the fully qualified
    com.meta.endo.vanilla identifier and the Meta AI.app bundle rather than the prefix alone to
    avoid conflating the two products. This detection evaluates launchd services, file paths,
    running processes, and installed applications to identify Meta AI installations. A score
    greater than 1 (at least two positive indicators) is required to confirm detection.
references:
    - https://ai.meta.com/meta-ai/download/
    - https://ai.meta.com/meta-ai/assistant/
    - https://www.okta.com/blog/threat-intelligence/detecting-openclaw-advanced-posture-checks/
author:
    - rafa.bono@okta.com
platform: macOS
query: |
    WITH launchd_metaai AS (
        SELECT COALESCE(COUNT(*), 0) AS total
        FROM launchd
        WHERE name LIKE '%com.meta.endo.vanilla%'
    ),
    file_metaai AS (
        SELECT COALESCE(COUNT(*), 0) AS total
        FROM file
        WHERE path LIKE '/Applications/Meta AI.app'
            OR path LIKE '/Users/%/Library/Application Support/com.meta.endo.vanilla'
            OR path LIKE '/Users/%/Library/Application Support/com.meta.endo.vanilla/%'
            OR path LIKE '/Users/%/Library/Caches/com.meta.endo.vanilla'
            OR path LIKE '/Users/%/Library/Preferences/com.meta.endo.vanilla.plist'
            OR path LIKE '/Users/%/Library/WebKit/com.meta.endo.vanilla'
    ),
    process_metaai AS (
        SELECT COALESCE(COUNT(*), 0) AS total
        FROM processes
        WHERE path LIKE '%/Meta AI.app/%'
    ),
    apps_metaai AS (
        SELECT COALESCE(COUNT(*), 0) AS total
        FROM apps
        WHERE bundle_identifier = 'com.meta.endo.vanilla'
    ),
    final_score AS (
        SELECT
            launchd_metaai.total
            + file_metaai.total
            + process_metaai.total
            + apps_metaai.total
            AS score
        FROM launchd_metaai, file_metaai, process_metaai, apps_metaai
    )
    SELECT
        CASE
            WHEN score <= 1 THEN 0
            WHEN score > 1 THEN 1
        END AS meta_ai_detected
    FROM final_score
    ;
