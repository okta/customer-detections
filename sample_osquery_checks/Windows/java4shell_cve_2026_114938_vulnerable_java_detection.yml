title: Java4Shell CVE-2026-114938 Vulnerable Java Runtime Detection (Windows)
id: 0601bb8575d541c5ade5ed66d3dcd1cb
description: |
    Detects Java runtimes in the version ranges reported as vulnerable to Java4Shell
    (CVE-2026-114938), a heap overflow in the x86-64 AVX-512 VBMI Base64 intrinsic of OpenJDK
    HotSpot, reported by Calif on 2026-11-17. Severity is rated CVSS 4.0 9.2 by Calif and CVSS 3.1
    8.1 by Oracle. At the time of writing the CVE record was reserved with no public description,
    and the technical details come from researcher write-ups rather than an official advisory.
    Per those write-ups, malformed Base64 ending in an extra "=" makes the decoder write past the
    end of the output array before rejecting the input, and it is reachable wherever a Java service
    decodes attacker controlled Base64, for example HTTP Basic headers, SAML artifacts and CSRF
    tokens. A Java client connecting over TLS to a malicious server may also be exposed. Calif
    reports working remote code execution against several products, but has not published the
    exploits, and other researchers (Upwind, Blackpoint) reproduced only JVM crashes and memory
    leaks. No in-the-wild exploitation is known and the vulnerability is not in CISA KEV at the
    time of writing. Only x86-64 hosts with AVX-512 VBMI (avx512f, avx512bw, avx512vbmi, bmi2) are
    exposed; ARM64 is not. The osquery cpuid table can report avx512f and bmi2 but not avx512vbmi
    or avx512bw, so the hardware gate requires avx512f and bmi2 and can flag a CPU that has AVX-512
    but not VBMI (for example Skylake-X). Treat a positive as "vulnerable runtime installed on
    potentially exposed hardware". The check reads installed Java products from the programs table
    (Add/Remove Programs). Oracle, Corretto, Zulu, Liberica, Microsoft and other builds that report
    a five-part version are matched on the full version against 17.0.6 through 17.0.21.0.3, 21
    through 21.0.13.0.3, 25 through 25.0.5.0.3 and 27 through 27.0.1.0.3. The fixed builds are
    17.0.21.1, 21.0.13.1, 25.0.5.1 and 27.0.1.1 (Corretto 17.0.21.1.2, 21.0.13.1.2, 25.0.5.1.2,
    27.0.1.1.4; SapMachine 17.0.21.1, 21.0.13.1, 25.0.5.1, 27.0.1.1). Eclipse Temurin MSI installs
    report a four-part version whose last number is the build number (for example 21.0.13.9), so
    they are matched on the first three components against 17.0.6 through 17.0.21, 21.0.0 through
    21.0.13, 25.0.0 through 25.0.5 and 27.0.0 through 27.0.1. Upwind confirmed Temurin 17.0.21,
    21.0.13 and 25.0.5 as vulnerable in a lab, and no fixed Temurin build was listed when this was
    written, so a Temurin build released after the fix will still be flagged until this check is
    updated. Microsoft OpenJDK, BellSoft Liberica and Red Hat also had no fixed builds listed, so
    a positive for those vendors may not be remediable yet; restrict the JVM with
    -XX:-UseBASE64Intrinsics as an interim workaround. Java 8 and 11 are not matched, and the Java
    SE 8 Performance Pack (8u511b33-perf) and GraalVM builds are not covered. Java bundled inside
    other products, such as Jenkins or Jira, is not visible to the programs table. A positive means
    update the runtime to a fixed build and restart Java services, or apply the workaround.
references:
    - https://calif.io/java4shell
    - https://thehackernews.com/2026/11/java4shell-cve-2026-114938-enables-pre.html
    - https://sec.okta.com/articles/2026/11/oracle-java-security-updates-openjdk-advisory-cve-2026-114938/
    - https://www.cve.org/CVERecord?id=CVE-2026-114938
    - https://www.upwind.io/blog/java4shell-what-we-know-now-and-what-comes-next
    - https://thehackernews.com/2026/11/oracle-to-patch-11-java-flaws-today-as.html
    - https://openjdk.org/groups/vulnerability/advisories/2026-11-17
    - https://blogs.oracle.com/java/transitioning-java-to-more-frequent-security-updates
author:
    - rafa.bono@okta.com
platform: Windows
query: |
    WITH cpu_gate AS (
        SELECT 1 AS ok
        FROM cpuid
        WHERE feature = 'avx512f' AND value = '1'
            AND EXISTS (SELECT 1 FROM cpuid WHERE feature = 'bmi2' AND value = '1')
    ),
    java_programs AS (
        SELECT
            version AS v,
            split(version, '.', 0) || '.' || split(version, '.', 1) || '.' || split(version, '.', 2) AS v3,
            (publisher LIKE '%Adoptium%' OR name LIKE '%Temurin%') AS is_temurin
        FROM programs
        WHERE name LIKE '%JDK%'
            OR name LIKE '%JRE%'
            OR name LIKE 'Java(TM)%'
            OR name LIKE '%OpenJDK%'
            OR name LIKE '%Temurin%'
            OR name LIKE '%Corretto%'
            OR name LIKE '%Zulu%'
            OR name LIKE '%Liberica%'
    )
    SELECT
        CASE WHEN count(*) = 0 THEN '0'
        ELSE '1'
        END AS java4shell_detected
    FROM java_programs, cpu_gate
    WHERE (is_temurin = 0 AND (
            (version_compare(v, '17.0.6') >= 0 AND version_compare(v, '17.0.21.0.3') <= 0)
            OR (version_compare(v, '21.0.0') >= 0 AND version_compare(v, '21.0.13.0.3') <= 0)
            OR (version_compare(v, '25.0.0') >= 0 AND version_compare(v, '25.0.5.0.3') <= 0)
            OR (version_compare(v, '27.0.0') >= 0 AND version_compare(v, '27.0.1.0.3') <= 0)))
        OR (is_temurin = 1 AND (
            (version_compare(v3, '17.0.6') >= 0 AND version_compare(v3, '17.0.21') <= 0)
            OR (version_compare(v3, '21.0.0') >= 0 AND version_compare(v3, '21.0.13') <= 0)
            OR (version_compare(v3, '25.0.0') >= 0 AND version_compare(v3, '25.0.5') <= 0)
            OR (version_compare(v3, '27.0.0') >= 0 AND version_compare(v3, '27.0.1') <= 0)))
    ;
